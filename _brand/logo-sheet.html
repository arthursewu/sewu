<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d10;color:#f2f5f8;font:400 15px/1.5 Inter,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:48px 40px}
h1{font-size:24px;font-weight:800;margin:0 0 4px}
.sub{color:#98a4b3;font-size:14px;margin:0 0 40px}
.hero{display:flex;align-items:center;gap:40px;background:#151b26;border:1px solid #263041;
      border-radius:16px;padding:48px;margin-bottom:20px}
.lock{display:flex;align-items:center;gap:20px}
.lock b{font-size:64px;font-weight:800;letter-spacing:-.04em}
.sizes{display:flex;align-items:flex-end;gap:34px;background:#151b26;border:1px solid #263041;
       border-radius:16px;padding:34px 40px;margin-bottom:20px;flex-wrap:wrap}
.sz{text-align:center}
.sz span{display:block;color:#98a4b3;font-size:12px;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{border-radius:16px;padding:40px;display:flex;align-items:center;justify-content:center;gap:16px;min-height:190px}
.dark{background:#0b0d10;border:1px solid #263041}
.light{background:#fbfaf6}
.light b{color:#0b0d10}
.panel b{font-size:38px;font-weight:800;letter-spacing:-.04em}
.tab{display:flex;align-items:center;gap:8px;background:#1e2634;border-radius:8px 8px 0 0;
     padding:9px 14px 9px 11px;width:230px;font-size:13px;color:#c7d0dc}
.cap{color:#6f7c90;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 14px}
</style></head><body><div class="wrap">
<h1>sewu — the mark</h1>
<p class="sub">A thousand is a multiplier. Scaling is multiplication.</p>

<div class="hero">
  <div class="lock">
    <svg viewBox="0 0 64 64" width="96" height="96"><rect width="64" height="64" rx="15" fill="#4ade80"/><path d="M22 22 42 42M42 22 22 42" stroke="#06240f" stroke-width="8" stroke-linecap="round"/></svg>
    <b>sewu</b>
  </div>
</div>

<div class="sizes">
  <div class="sz"><svg viewBox="0 0 64 64" width="96" height="96"><rect width="64" height="64" rx="15" fill="#4ade80"/><path d="M22 22 42 42M42 22 22 42" stroke="#06240f" stroke-width="8" stroke-linecap="round"/></svg><span>96px</span></div>
  <div class="sz"><svg viewBox="0 0 64 64" width="64" height="64"><rect width="64" height="64" rx="15" fill="#4ade80"/><path d="M22 22 42 42M42 22 22 42" stroke="#06240f" stroke-width="8" stroke-linecap="round"/></svg><span>64px</span></div>
  <div class="sz"><svg viewBox="0 0 64 64" width="44" height="44"><rect width="64" height="64" rx="15" fill="#4ade80"/><path d="M22 22 42 42M42 22 22 42" stroke="#06240f" stroke-width="8" stroke-linecap="round"/></svg><span>44px</span></div>
  <div class="sz"><svg viewBox="0 0 64 64" width="26" height="26"><rect width="64" height="64" rx="15" fill="#4ade80"/><path d="M22 22 42 42M42 22 22 42" stroke="#06240f" stroke-width="8" stroke-linecap="round"/></svg><span>26px · nav</span></div>
  <div class="sz"><svg viewBox="0 0 64 64" width="16" height="16"><rect width="64" height="64" rx="15" fill="#4ade80"/><path d="M22 22 42 42M42 22 22 42" stroke="#06240f" stroke-width="8" stroke-linecap="round"/></svg><span>16px · favicon</span></div>
  <div class="sz"><div class="tab"><svg viewBox="0 0 64 64" width="15" height="15"><rect width="64" height="64" rx="15" fill="#4ade80"/><path d="M22 22 42 42M42 22 22 42" stroke="#06240f" stroke-width="8" stroke-linecap="round"/></svg> Scale Report</div><span>browser tab</span></div>
</div>

<div class="two">
  <div>
    <p class="cap">On dark</p>
    <div class="panel dark">
      <svg viewBox="0 0 64 64" width="52" height="52"><rect width="64" height="64" rx="15" fill="#4ade80"/><path d="M22 22 42 42M42 22 22 42" stroke="#06240f" stroke-width="8" stroke-linecap="round"/></svg>
      <b>sewu</b>
    </div>
  </div>
  <div>
    <p class="cap">On light</p>
    <div class="panel light">
      <svg viewBox="0 0 64 64" width="52" height="52"><rect width="64" height="64" rx="15" fill="#0b0d10"/><path d="M22 22 42 42M42 22 22 42" stroke="#4ade80" stroke-width="8" stroke-linecap="round"/></svg>
      <b>sewu</b>
    </div>
  </div>
</div>
</div></body></html>
