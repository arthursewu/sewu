<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f2f5f8;font:400 14px/1.5 Inter,sans-serif;padding:40px}
h1{font-size:23px;font-weight:800;margin:0 0 4px}.sub{color:#98a4b3;font-size:14px;margin:0 0 26px;max-width:88ch}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1150px}
.c{background:#151b26;border:1px solid #263041;border-radius:12px;padding:20px 16px 14px;text-align:center}
.c .lg{width:76px;height:76px;margin:0 auto}
.c .rowm{display:flex;align-items:center;justify-content:center;gap:11px;margin-top:14px;padding-top:13px;border-top:1px solid #263041}
.s26{width:26px;height:26px}.s18{width:18px;height:18px}.s14{width:14px;height:14px}
.id{font-size:13px;font-weight:800;margin-top:11px}.nm{font-size:11.5px;color:#8d99ab;margin-top:3px;min-height:30px;line-height:1.4}
.lock{display:flex;align-items:center;gap:10px;justify-content:center;background:#0b0d10;border:1px solid #232936;border-radius:8px;padding:9px 12px;margin-top:11px}
.lock b{font-size:17px;font-weight:800;letter-spacing:-.03em}.lock .m{width:22px;height:22px}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#4ade80;margin:30px 0 13px;font-weight:700}
</style></head><body>
<h1>N1 + arrow — the executions</h1>
<p class="sub">Same zigzag, six ways of ending it. The 14px column is the judge: whichever still reads as <span style="color:#4ade80">a direction</span> rather than a squiggle wins.</p>
<h2>Boxed</h2><div class="grid" id="a"></div>
<h2>Open</h2><div class="grid" id="b"></div>
<script>
var A='#4ade80', D='#06240f';
function bx(i){return '<rect width="64" height="64" rx="15" fill="'+A+'"/>'+i}
function L(c,w,d){return '<path d="'+d+'" stroke="'+c+'" stroke-width="'+w+'" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'}
var Z='M16 44 28 32l8 8 13-17';   // the N1 zigzag

var SET={
 A1:['Corner arrowhead', function(c,w){return L(c,w,Z)+L(c,w,'M41 27h8v-8')}],
 A2:['Small corner head', function(c,w){return L(c,w,Z)+L(c,w,'M44 27h5v-5')}],
 A3:['Chevron head', function(c,w){return L(c,w,Z)+L(c,w,'M42 22l7-5 0 0M49 17l-4 8')}],
 A4:['Solid triangle', function(c,w){return L(c,w,'M16 44 28 32l8 8 10-13')+'<path d="M52 14 44 30l14-3Z" fill="'+c+'"/>'}],
 A5:['Head on the line', function(c,w){return L(c,w,'M16 44 28 32l8 8 11-15')+L(c,w,'M39 25h9v9')}],
 A6:['Long final stroke', function(c,w){return L(c,w,'M14 46 26 34l8 8 16-21')+L(c,w,'M42 19h8v8')}]
};
function card(id,boxed){
 var label=SET[id][0], fn=SET[id][1], inner = boxed ? bx(fn(D,7)) : fn(A,8);
 function s(){return '<svg viewBox="0 0 64 64" width="100%" height="100%">'+inner+'</svg>'}
 return '<div class="c"><div class="lg">'+s()+'</div>'+
  '<div class="rowm"><div class="s26">'+s()+'</div><div class="s18">'+s()+'</div><div class="s14">'+s()+'</div></div>'+
  '<div class="id">'+id+(boxed?'':'o')+'</div><div class="nm">'+label+'</div>'+
  '<div class="lock"><span class="m">'+s()+'</span><b>sewu</b></div></div>';
}
Object.keys(SET).forEach(function(id){
 document.getElementById('a').insertAdjacentHTML('beforeend', card(id,true));
 document.getElementById('b').insertAdjacentHTML('beforeend', card(id,false));
});
</script></body></html>
